<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evening Ride Photos &amp; Videos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      background: linear-gradient(180deg, #1e1b4b 0%, #581c87 28%, #be185d 56%, #f97316 82%, #fde047 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    .gallery-stage {
      position: relative;
      z-index: 5;
      width: min(960px, 94vw);
      max-height: 85vh;
      overflow-y: auto;
      background-color: rgba(255, 247, 250, 0.62);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 18px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 20px 50px rgba(30, 27, 75, 0.35);
      padding: 28px 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 24px;
    }

    .gallery-stage h1 {
      font-size: 2.15rem;
      color: #9f1239;
      text-shadow: 0 1px 10px rgba(255, 255, 255, 0.92);
    }

    .gallery-intro {
      font-size: 1.05rem;
      font-weight: 500;
      color: #881337;
      max-width: 620px;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.9);
    }

    .section-label {
      width: 100%;
      text-align: left;
      font-size: 1.35rem;
      font-weight: 700;
      color: #9f1239;
      border-bottom: 2px solid rgba(255, 179, 198, 0.85);
      padding-bottom: 6px;
      margin-top: 4px;
    }

    .media-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
      align-items: start;
    }

    .media-card {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(255, 179, 198, 0.85);
      border-radius: 16px;
      padding: 12px 12px 16px;
      box-shadow: 0 10px 24px rgba(136, 19, 55, 0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.25s ease;
    }

    .media-card:hover {
      transform: translateY(-4px);
    }

    .media-card img,
.media-card video {
  width: 100%;
  height: auto;
  max-height: 540px;
  object-fit: contain;
  border-radius: 11px;
  display: block;
}

.media-card video {
  background-color: #0f172a;
}

    .media-subtitle {
      font-size: 0.96rem;
      font-weight: 500;
      line-height: 1.45;
      color: #881337;
      padding: 0 6px;
    }

    .inside-back-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%);
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(127, 29, 29, 0.35);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .inside-back-btn:hover {
      background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <main class="gallery-stage">
    <h1>The Main Part 🛵</h1>
    <p class="gallery-intro">Every moment was like a dream for me, Dodo.</p>

    <h2 class="section-label">Photos</h2>
    <div class="media-grid">
      <figure class="media-card">
        <img src="pracsar.jpeg" alt="Evening Ride 1" />
        <figcaption class="media-subtitle">The momemt u wore my amma's saree, just soo nice.</figcaption>
      </figure>

      <figure class="media-card">
        <img src="love.jpeg" alt="Evening Ride 2" />
        <figcaption class="media-subtitle">These were some wonderful moments.</figcaption>
      </figure>
    </div>

    <h2 class="section-label">Videos</h2>
    <div class="media-grid">
      <figure class="media-card">
        <video src="pracdate.mp4" controls preload="metadata"></video>
        <figcaption class="media-subtitle">Look at you how ur taking pictures.</figcaption>
      </figure>
    </div>

    <a href="listen3.html" class="inside-back-btn">&larr; Back to Evening Rides</a>
  </main>

</body>
</html>
