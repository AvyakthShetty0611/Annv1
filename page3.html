<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Anniversary - Page 3</title>
  <!-- Romantic Cursive Font for the Rising Text Animation -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      background-color: #ffd6e0; /* Soft light pink background */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* 1. Background Floating Hearts Container (Behind the center box) */
    .bg-hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .floating-heart {
      position: absolute;
      bottom: -60px;
      color: #e11d48;
      text-shadow: 0 2px 10px rgba(225, 29, 72, 0.35);
      user-select: none;
      pointer-events: none;
      opacity: 0;
      animation: floatUpAndPop ease-in infinite;
    }

    @keyframes floatUpAndPop {
      0% {
        transform: translateY(0) scale(0.3) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
        transform: translateY(-8vh) scale(1.1) rotate(-10deg);
      }
      25% {
        transform: translateY(-25vh) scale(1) rotate(12deg);
      }
      50% {
        transform: translateY(-50vh) scale(1.05) rotate(-15deg);
      }
      75% {
        transform: translateY(-75vh) scale(0.95) rotate(10deg);
        opacity: 0.85;
      }
      100% {
        transform: translateY(-110vh) scale(0.8) rotate(-20deg);
        opacity: 0;
      }
    }

    /* 2. Diagonal Butterfly Overlay Layer (Passes across the entire page) */
    .butterfly-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .butterfly {
      position: absolute;
      font-size: 38px;
      filter: drop-shadow(0 6px 12px rgba(190, 24, 93, 0.35));
      user-select: none;
      opacity: 0;
    }

    .butterfly-inner {
      display: inline-block;
      animation: wingFlap 0.38s ease-in-out infinite alternate;
    }

    @keyframes wingFlap {
      0% {
        transform: scaleX(1) scaleY(1);
      }
      100% {
        transform: scaleX(0.45) scaleY(1.08);
      }
    }

    /* 3. Rising Text Animation (Hidden until Listen button is clicked) */
    .listen-popup-toast {
      position: fixed;
      left: 50%;
      bottom: -80px;
      transform: translateX(-50%);
      z-index: 50;
      display: none;
      background: linear-gradient(135deg, #fff0f4 0%, #ffe4ec 100%);
      color: #9f1239;
      border: 2px solid #f43f5e;
      border-radius: 50px;
      padding: 16px 40px;
      font-family: 'Dancing Script', cursive;
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
      box-shadow: 0 16px 38px rgba(190, 24, 93, 0.35);
      pointer-events: none;
    }

    .listen-popup-toast.rising {
      display: block;
      animation: slowRiseUp 2.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes slowRiseUp {
      0% {
        bottom: -80px;
        opacity: 0;
        transform: translateX(-50%) scale(0.85);
      }
      20% {
        opacity: 1;
      }
      85% {
        bottom: 46vh;
        opacity: 1;
        transform: translateX(-50%) scale(1.05);
      }
      100% {
        bottom: 52vh;
        opacity: 0;
        transform: translateX(-50%) scale(1.08);
      }
    }

    /* Double-Size Static Content Container (880px x 640px) */
    .large-page-stage {
      position: relative;
      z-index: 2;
      width: min(880px, 94vw);
      min-height: min(640px, 80vh);
      background-color: #fff0f4; /* Solid opaque background blocks hearts behind it */
      border-radius: 18px;
      border: 2px solid #ffb3c6;
      box-shadow: 0 18px 40px rgba(190, 24, 93, 0.14);
      padding: 44px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #881337;
      text-align: center;
      gap: 20px;
    }

    .large-page-stage h1 {
      font-size: 2.3rem;
      color: #9f1239;
      letter-spacing: 0.4px;
    }

    .large-page-stage p {
      font-size: 1.25rem;
      line-height: 1.7;
      max-width: 650px;
      color: #881337;
    }

    /* Dark Red Listen (Left) & Read (Right) Choice Buttons */
    .choice-buttons {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 72px;
    }

    .choice-btn {
      padding: 14px 34px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%);
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(127, 29, 29, 0.32);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .choice-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
      box-shadow: 0 12px 24px rgba(127, 29, 29, 0.42);
    }

    /* Bottom Navigation Controls */
    .controls {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .nav-btn {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background-color: #e11d48;
      border-radius: 50px;
      box-shadow: 0 6px 16px rgba(225, 29, 72, 0.25);
    }

    .nav-btn:hover {
      background-color: #be123c;
    }
  </style>
</head>
<body>

  <!-- 1. Diagonal Butterflies Layer -->
  <div class="butterfly-layer" id="butterflyLayer"></div>

  <!-- 2. Background Floating Hearts (Visible around the pink background) -->
  <div class="bg-hearts-container" id="bgHeartsContainer"></div>

  <!-- 3. Hidden Rising Text Badge (Appears only after pressing Listen) -->
  <div class="listen-popup-toast" id="listenPopup">I knew you will choose this option ❤️</div>

  <!-- Double-Sized Static Light Pink Content Box -->
  <main class="large-page-stage">
    <h1>Welcome To My Heart</h1>
    <p>
      Dodo, you can either choose to read or listen to what I have to say. Click on the button below, whichever you choose to do.<br />
      U r now entering Avyakth's Love Land, So get ready.
    </p>

    <div class="choice-buttons">
      <a href="listen.html?play=true" id="listenBtn" class="choice-btn">🎧 Listen</a>
      <a href="read.html?play=true" class="choice-btn">📖 Read</a>
    </div>
  </main>

  <!-- Navigation Buttons -->
  <div class="controls">
    <a href="page2.html" class="nav-btn">&larr; Back</a>
    <a href="index.html" class="nav-btn">Home</a>
  </div>

  <script>
    // 1. Trigger 10 Ultra-Slow Diagonal Butterflies whenever Page 3 opens
    const butterflyLayer = document.getElementById('butterflyLayer');

    function launchButterflies() {
      if (!butterflyLayer) return;

      const butterflyCount = 10;

      for (let i = 0; i < butterflyCount; i++) {
        const butterfly = document.createElement('div');
        butterfly.className = 'butterfly';

        const inner = document.createElement('span');
        inner.className = 'butterfly-inner';
        inner.textContent = '🦋';
        inner.style.animationDuration = (0.38 + Math.random() * 0.16) + 's';
        butterfly.appendChild(inner);

        const size = Math.floor(Math.random() * 20) + 28;
        butterfly.style.fontSize = size + 'px';

        const leftToRight = Math.random() > 0.45;
        const startX = leftToRight ? (-10 - Math.random() * 12) : (105 + Math.random() * 12);
        const endX = leftToRight ? (108 + Math.random() * 12) : (-12 - Math.random() * 12);

        const startY = 55 + Math.random() * 50;
        const endY = -12 - Math.random() * 20;

        const midX = (startX + endX) / 2 + (Math.random() * 22 - 11);
        const midY = (startY + endY) / 2 + (Math.random() * 18 - 9);

        const tilt = leftToRight ? 32 : -32;
        const duration = 16000 + Math.random() * 6000;
        const delay = i * 950 + Math.random() * 600;

        butterflyLayer.appendChild(butterfly);

        const flight = butterfly.animate(
          [
            {
              transform: `translate(${startX}vw, ${startY}vh) rotate(${tilt}deg) scale(0.85)`,
              opacity: 0
            },
            {
              opacity: 1,
              offset: 0.08
            },
            {
              transform: `translate(${midX}vw, ${midY}vh) rotate(${tilt + (leftToRight ? -12 : 12)}deg) scale(1.06)`,
              offset: 0.5
            },
            {
              opacity: 1,
              offset: 0.92
            },
            {
              transform: `translate(${endX}vw, ${endY}vh) rotate(${tilt}deg) scale(0.9)`,
              opacity: 0
            }
          ],
          {
            duration: duration,
            delay: delay,
            easing: 'linear',
            fill: 'forwards'
          }
        );

        flight.onfinish = () => butterfly.remove();
      }
    }

    launchButterflies();

    // 2. Background Floating Hearts Generator
    const heartsContainer = document.getElementById('bgHeartsContainer');
    const heartSymbols = ['❤️', '💖', '💕', '💓', '❤️'];

    function createFloatingHeart() {
      if (!heartsContainer) return;

      const heart = document.createElement('span');
      heart.className = 'floating-heart';
      heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = Math.random() * 98 + 'vw';

      const size = Math.random() * 20 + 16;
      heart.style.fontSize = size + 'px';

      const duration = Math.random() * 4 + 6;
      heart.style.animationDuration = duration + 's';

      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }

    setInterval(createFloatingHeart, 450);

    for (let i = 0; i < 10; i++) {
      setTimeout(createFloatingHeart, i * 180);
    }

    // 3. Rising "I know you will use this" Animation on Listen Click
    const listenBtn = document.getElementById('listenBtn');
    const listenPopup = document.getElementById('listenPopup');

    if (listenBtn && listenPopup) {
      listenBtn.addEventListener('click', (e) => {
        e.preventDefault(); // Pause immediate redirect so the rising animation plays
        listenPopup.classList.add('rising');

        // Navigate to listen.html after 2.5 seconds
        setTimeout(() => {
          window.location.href = listenBtn.href;
        }, 2500);
      });
    }
  </script>

</body>
</html>
