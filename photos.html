<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Photos - How it all Started</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      background-color: #091124;
      background-image: url('night-temple.png'); /* Change to night-temple.jpg if saved as JPG */
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Main Frosted Gallery Container */
    .gallery-stage {
      position: relative;
      z-index: 5;
      width: min(940px, 94vw);
      max-height: 84vh;
      overflow-y: auto;
      background-color: rgba(255, 240, 244, 0.42);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border-radius: 18px;
      border: 2px solid rgba(255, 179, 198, 0.65);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      padding: 28px 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 22px;
    }

    .gallery-stage h1 {
      font-size: 2.15rem;
      color: #9f1239;
      text-shadow: 0 1px 10px rgba(255, 255, 255, 0.9);
    }

    .gallery-intro {
      font-size: 1.05rem;
      font-weight: 500;
      color: #881337;
      max-width: 600px;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.9);
    }

    /* Responsive Photo Cards Grid */
    .photos-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 22px;
      align-items: start;
    }

    .photo-card {
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid rgba(255, 179, 198, 0.85);
      border-radius: 16px;
      padding: 12px 12px 16px;
      box-shadow: 0 10px 24px rgba(136, 19, 55, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.25s ease;
    }

    .photo-card:hover {
      transform: translateY(-4px);
    }

    .photo-card img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 11px;
      display: block;
    }

    .photo-subtitle {
      font-size: 0.96rem;
      font-weight: 500;
      line-height: 1.45;
      color: #881337;
      padding: 0 6px;
    }

    /* Return Button Inside the Box */
    .inside-back-btn {
      display: inline-block;
      margin-top: 6px;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%);
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(127, 29, 29, 0.35);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .inside-back-btn:hover {
      background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <main class="gallery-stage">
    <h1>Our Little Moments 📸</h1>
    <p class="gallery-intro">A few snapshots from where our journey began, Dodo.</p>

    <!-- Update src filenames and subtitles below with your actual photos in the annv folder -->
    <div class="photos-grid">
      <figure class="photo-card">
        <img src="firstpic.jpeg" alt="Memory 1" />
        <figcaption class="photo-subtitle">This is our first picture together and the first time we met was also in the temple,Blessed.</figcaption>
      </figure>

      <figure class="photo-card">
        <img src="potrait.jpeg" alt="Memory 2" />
        <figcaption class="photo-subtitle">The first time i drew someone and it came out so beautifully, i hope u liked madam.</figcaption>
      </figure>

      <figure class="photo-card">
        <img src="Firstflow.jpeg" alt="Memory 3" />
        <figcaption class="photo-subtitle">The first set of flowers i gave u and u liked and hugged me for it.</figcaption>
      </figure>
    </div>

    <a href="listen.html" class="inside-back-btn">&larr; Back to Story</a>
  </main>

</body>
</html>
