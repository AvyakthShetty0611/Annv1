<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evening Rides with You - Listen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 24px;
      background: linear-gradient(180deg, #1e1b4b 0%, #581c87 26%, #be185d 54%, #f97316 80%, #fde047 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Twinkling Early Evening Stars in Upper Sky */
    .stars {
      position: fixed;
      inset: 0 0 55% 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 14% 18%, rgba(255, 255, 255, 0.85), transparent),
        radial-gradient(1.5px 1.5px at 28% 10%, rgba(255, 255, 255, 0.7), transparent),
        radial-gradient(2px 2px at 46% 14%, rgba(255, 255, 255, 0.8), transparent),
        radial-gradient(1.5px 1.5px at 66% 8%, rgba(255, 255, 255, 0.75), transparent),
        radial-gradient(2px 2px at 84% 16%, rgba(255, 255, 255, 0.9), transparent),
        radial-gradient(1.5px 1.5px at 92% 24%, rgba(255, 255, 255, 0.65), transparent);
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.45; }
      100% { opacity: 0.95; }
    }

    /* Setting Evening Sun on the Horizon */
    .evening-sun {
      position: fixed;
      bottom: 135px;
      right: 12%;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, #fef9c3 18%, #fb923c 60%, rgba(249, 115, 22, 0) 76%);
      box-shadow: 0 0 75px 30px rgba(251, 146, 60, 0.55);
      z-index: 1;
      pointer-events: none;
      animation: sunsetGlow 5s ease-in-out infinite alternate;
    }

    @keyframes sunsetGlow {
      0% { transform: scale(1); opacity: 0.88; }
      100% { transform: scale(1.06); opacity: 1; }
    }

    /* Warm Tinted Drifting Evening Clouds */
    .cloud {
      position: fixed;
      background: rgba(254, 215, 170, 0.32);
      border-radius: 100px;
      z-index: 2;
      pointer-events: none;
      filter: blur(2px);
      animation: driftCloud linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud-1 {
      width: 190px;
      height: 52px;
      top: 15%;
      left: -210px;
      animation-duration: 42s;
    }
    .cloud-1::before { width: 82px; height: 82px; top: -38px; left: 28px; }
    .cloud-1::after { width: 64px; height: 64px; top: -26px; left: 92px; }

    .cloud-2 {
      width: 230px;
      height: 60px;
      top: 29%;
      left: -260px;
      animation-duration: 52s;
      animation-delay: 10s;
    }
    .cloud-2::before { width: 96px; height: 96px; top: -44px; left: 34px; }
    .cloud-2::after { width: 74px; height: 74px; top: -30px; left: 110px; }

    @keyframes driftCloud {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(100vw + 340px)); }
    }

    /* Full-Width Evening City Skyline, Road, Streetlights & Couple on Scooter */
    .city-evening-scene {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 290px;
      z-index: 3;
      pointer-events: none;
    }

    /* Animated Scooter Group Cruising Along the City Road */
    .scooter-ride-group {
      animation: scooterCruise 18s linear infinite, scooterBounce 0.65s ease-in-out infinite alternate;
    }

    @keyframes scooterCruise {
      0% { transform: translateX(-240px); }
      100% { transform: translateX(1580px); }
    }

    @keyframes scooterBounce {
      0% { margin-top: 0; }
      100% { margin-top: -2px; }
    }

    /* Main Frosted Center Box */
    .large-page-stage {
      position: relative;
      z-index: 5;
      width: min(860px, 92vw);
      min-height: min(580px, 78vh);
      max-height: 80vh;
      overflow-y: auto;
      background-color: rgba(255, 247, 250, 0.56);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 18px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 20px 50px rgba(30, 27, 75, 0.35);
      padding: 28px 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: #881337;
      text-align: center;
      gap: 16px;
    }

    .top-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .large-page-stage h1 {
      font-size: 2.25rem;
      color: #9f1239;
      text-shadow: 0 1px 10px rgba(255, 255, 255, 0.92);
    }

    .subtitle {
      font-size: 1.1rem;
      font-weight: 500;
      line-height: 1.65;
      color: #881337;
      max-width: 650px;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.9);
    }

    /* Subtle Smaller White Box for "Photos & Videos" */
    .photos-box-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 210px;
      padding: 12px 34px;
      margin: 2px 0;
      background-color: rgba(255, 255, 255, 0.82);
      border: 1.5px solid rgba(255, 179, 198, 0.95);
      border-radius: 12px;
      color: #881337;
      font-size: 1.12rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(136, 19, 55, 0.14);
      transition: background-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .photos-box-link:hover {
      background-color: rgba(255, 255, 255, 0.98);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(136, 19, 55, 0.2);
    }

    .audio-card {
      width: min(460px, 95%);
      background: rgba(255, 241, 242, 0.88);
      border: 2px solid rgba(244, 63, 94, 0.78);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 20px rgba(225, 29, 72, 0.16);
    }

    audio {
      width: 100%;
      height: 38px;
      outline: none;
    }

    .play-toggle-btn {
      padding: 10px 26px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(127, 29, 29, 0.28);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .play-toggle-btn:hover {
      background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
      transform: translateY(-1px);
    }

    .story-content {
      width: 100%;
      max-width: 720px;
      margin-top: 6px;
      font-size: 1.12rem;
      font-weight: 500;
      line-height: 1.75;
      color: #881337;
      text-align: left;
      white-space: pre-line;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.9);
    }

    /* Inside Navigation Buttons Row */
    .inside-nav-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
    }
     /* Floating "You & Me" Label Above Their Heads at the Start */
.couple-tag {
  opacity: 0;
  animation: coupleTagFade 18s ease-in-out infinite;
}

@keyframes coupleTagFade {
  0%, 4% {
    opacity: 0;
    transform: translateY(4px);
  }
  7%, 18% {
    opacity: 1;
    transform: translateY(0);
  }
  23%, 100% {
    opacity: 0;
    transform: translateY(-4px);
  }
}

    .inside-btn {
      display: inline-block;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%);
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(127, 29, 29, 0.3);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .inside-btn:hover {
      background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
      transform: translateY(-2px);
    }

    /* Outside Navigation Buttons */
    .controls {
      position: relative;
      z-index: 5;
      display: flex;
      gap: 16px;
    }

    .nav-btn {
      display: inline-block;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background-color: #e11d48;
      border-radius: 50px;
      box-shadow: 0 6px 18px rgba(30, 27, 75, 0.35);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .nav-btn:hover {
      background-color: #be123c;
      transform: translateY(-2px);
    }
  </style>
</head>

    const audio3 = document.getElementById('voiceAudio3');
    const playToggleBtn3 = document.getElementById('playToggleBtn3');

    playToggleBtn3.addEventListener('click', () => {
      if (audio3.paused) {
        audio3_2.pause();
        audio3.play();
      } else {
        audio3.pause();
      }
    });

    const audio3_2 = document.getElementById('voiceAudio3_2');
