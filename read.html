<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Read - Happy Anniversary</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      background-color: #ffd6e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Floating Hearts */
    .bg-hearts-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .floating-heart {
      position: absolute;
      bottom: -60px;
      color: #e11d48;
      text-shadow: 0 2px 10px rgba(225, 29, 72, 0.35);
      user-select: none;
      pointer-events: none;
      opacity: 0;
      animation: floatUpAndPop ease-in infinite;
    }

    @keyframes floatUpAndPop {
      0% { transform: translateY(0) scale(0.3) rotate(0deg); opacity: 0; }
      10% { opacity: 0.9; transform: translateY(-8vh) scale(1.1) rotate(-10deg); }
      50% { transform: translateY(-50vh) scale(1.05) rotate(-15deg); }
      100% { transform: translateY(-110vh) scale(0.8) rotate(-20deg); opacity: 0; }
    }

    /* Main Content Box */
    .large-page-stage {
      position: relative;
      z-index: 2;
      width: min(880px, 94vw);
      max-height: 78vh;
      overflow-y: auto;
      background-color: #fff0f4;
      border-radius: 18px;
      border: 2px solid #ffb3c6;
      box-shadow: 0 18px 40px rgba(190, 24, 93, 0.14);
      padding: 40px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #881337;
      text-align: center;
      gap: 20px;
    }

    .large-page-stage h1 {
      font-size: 2.1rem;
      color: #9f1239;
    }

    .letter-text {
      font-size: 1.15rem;
      line-height: 1.8;
      text-align: left;
      max-width: 720px;
      color: #881337;
      white-space: pre-line;
    }

    /* Compact Audio Bar at Top of Letter */
    .mini-audio-bar {
      width: min(440px, 100%);
      background: #ffe4ec;
      border: 1.5px solid #f43f5e;
      border-radius: 50px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mini-audio-bar audio {
      width: 100%;
      height: 34px;
    }

    /* Bottom Navigation */
    .controls {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 16px;
    }

    .nav-btn {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background-color: #e11d48;
      border-radius: 50px;
      box-shadow: 0 6px 16px rgba(225, 29, 72, 0.25);
    }

    .nav-btn:hover {
      background-color: #be123c;
    }
  </style>
</head>
<body>

  <div class="bg-hearts-container" id="bgHeartsContainer"></div>

  <main class="large-page-stage">
    <h1>📖 Oiii I know u dont have patience to read so go listen to what i have to say</h1>

    <!-- Same Audio Playing While Reading -->
   
    
        </main>

  <div class="controls">
    <a href="page3.html" class="nav-btn">&larr; Back</a>
    <a href="index.html" class="nav-btn">Home</a>
  </div>

  <script>
    const audio = document.getElementById('voiceAudio');
    const params = new URLSearchParams(window.location.search);

    if (params.get('play') === 'true' && audio) {
      audio.play().catch(() => {});
    }

    // Floating hearts background
    const heartsContainer = document.getElementById('bgHeartsContainer');
    const heartSymbols = ['❤️', '💖', '💕', '💓', '❤️'];

    function createFloatingHeart() {
      if (!heartsContainer) return;
      const heart = document.createElement('span');
      heart.className = 'floating-heart';
      heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = Math.random() * 98 + 'vw';
      heart.style.fontSize = (Math.random() * 20 + 16) + 'px';
      const duration = Math.random() * 4 + 6;
      heart.style.animationDuration = duration + 's';
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), duration * 1000);
    }

    setInterval(createFloatingHeart, 450);
    for (let i = 0; i < 10; i++) setTimeout(createFloatingHeart, i * 180);
  </script>
</body>
</html>
