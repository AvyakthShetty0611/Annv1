<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bijapur Photos &amp; Videos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      background: linear-gradient(180deg, #38bdf8 0%, #7dd3fc 42%, #bae6fd 78%, #fef08a 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Glowing Sun in Top-Right Sky */
    .sun {
      position: fixed;
      top: 42px;
      right: 68px;
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: radial-gradient(circle, #fef9c3 15%, #fde047 55%, rgba(250, 204, 21, 0) 75%);
      box-shadow: 0 0 60px 25px rgba(253, 224, 71, 0.75);
      z-index: 1;
      pointer-events: none;
    }

    /* Main Frosted Gallery Container */
    .gallery-stage {
      position: relative;
      z-index: 5;
      width: min(960px, 94vw);
      max-height: 85vh;
      overflow-y: auto;
      background-color: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 18px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 20px 50px rgba(14, 116, 144, 0.2);
      padding: 28px 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 24px;
    }

    .gallery-stage h1 {
      font-size: 2.15rem;
      color: #9f1239;
      text-shadow: 0 1px 10px rgba(255, 255, 255, 0.9);
    }

    .gallery-intro {
      font-size: 1.05rem;
      font-weight: 500;
      color: #881337;
      max-width: 620px;
      text-shadow: 0 1px 8px rgba(255, 255, 255, 0.85);
    }

    .section-label {
      width: 100%;
      text-align: left;
      font-size: 1.35rem;
      font-weight: 700;
      color: #9f1239;
      border-bottom: 2px solid rgba(255, 179, 198, 0.85);
      padding-bottom: 6px;
      margin-top: 4px;
    }

    /* Responsive Media Grid for Photos & Videos */
    .media-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
      align-items: start;
    }

    .media-card {
      background: rgba(255, 255, 255, 0.88);
      border: 2px solid rgba(255, 179, 198, 0.85);
      border-radius: 16px;
      padding: 12px 12px 16px;
      box-shadow: 0 10px 24px rgba(14, 116, 144, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.25s ease;
    }

    .media-card:hover {
      transform: translateY(-4px);
    }

    .media-card img,
.media-card video {
  width: 100%;
  height: auto;
  max-height: 520px;
  object-fit: contain;
  border-radius: 11px;
  display: block;
  background-color: transparent;
}

    .media-subtitle {
      font-size: 0.96rem;
      font-weight: 500;
      line-height: 1.45;
      color: #881337;
      padding: 0 6px;
    }

    /* Return Button Inside the Box */
    .inside-back-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%);
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(127, 29, 29, 0.35);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .inside-back-btn:hover {
      background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="sun"></div>

  <main class="gallery-stage">
    <h1>Bijapur Memories 📸🎬</h1>
    <p class="gallery-intro">Our photos and videos from those unforgettable days in Bijapur, Dodo.</p>

    <!-- Photos Section -->
    <h2 class="section-label">Photos</h2>
    <div class="media-grid">
      <figure class="media-card">
        <img src="prac3.jpeg" alt="Bijapur Memory 1" />
        <figcaption class="media-subtitle">Back then u shared every photo of u with me even before i asked u, i felt great.</figcaption>
      </figure>

      <figure class="media-card">
        <img src="prac4.jpeg" alt="Bijapur Memory 2" />
        <figcaption class="media-subtitle">Madam in Saree.</figcaption>
      </figure>
<figure class="media-card">
        <img src="prac1.jpeg" alt="Bijapur Memory 2" />
        <figcaption class="media-subtitle">Wowww.</figcaption>
      </figure>
<br>
      <figure class="media-card">
        <img src="prac2.jpeg" alt="Bijapur Memory 2" />
        <figcaption class="media-subtitle">Look how u do photoshoot everywhere u go.</figcaption>
      </figure>
    </div>
      
    </div>

    <!-- Videos Section -->
    <h2 class="section-label">Videos</h2>
    <div class="media-grid">
      <figure class="media-card">
        <video src="pracvid.mp4" controls preload="metadata"></video>
        <figcaption class="media-subtitle">Look how cute ur looking here, Wow.</figcaption>
      </figure>

      <figure class="media-card">
        <video src="kush.mp4" controls preload="metadata"></video>
        <figcaption class="media-subtitle">Always playing with the baby like a baby.</figcaption>
      </figure>
    </div>

    <a href="listen2.html" class="inside-back-btn">&larr; Back to Bijapur </a>
  </main>

</body>
</html>
